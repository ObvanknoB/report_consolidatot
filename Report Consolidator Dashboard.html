<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Consolidator Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F4F5F6;color:#1B1F23;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #1F5FBF;outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding:28px 24px 48px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.01em}
h2{margin:0;font-size:16px}
p{margin:0}
.muted{color:#4A535B}
.small{font-size:12px}
.card{background:#fff;border:1px solid #DDE1E5;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #C5CBD1;background:#fff;font-weight:600}
.btn:hover{background:#F4F5F6}
.btn.primary{background:#1F5FBF;border-color:#1F5FBF;color:#fff}
.btn.primary:hover{background:#194E9C}
.btn.danger{border-color:#B3261E;color:#A02019}
.btn.solid-danger{background:#B3261E;border-color:#B3261E;color:#fff}
.btn.sm{padding:0 14px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid #DDE1E5;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#4A535B}
.kpi .v{font-size:30px;font-weight:700;line-height:1.1}
.main{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.left{flex:1 1 340px;max-width:440px;min-width:0;display:flex;flex-direction:column;gap:16px}
.right{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.drop{border:2px dashed #B7BEC5;background:#FAFBFC;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.drop.over{border-color:#1F5FBF;background:#EAF1FD}
.file{border:1px solid #DDE1E5;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.chip{flex:none;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
label.f{font-size:13px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],select,textarea{min-height:44px;padding:0 12px;border-radius:8px;border:1px solid #C5CBD1;background:#fff;width:100%}
textarea{padding:10px 12px;resize:vertical}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #C5CBD1;background:#fff;font-weight:600}
.tab[aria-pressed=true]{background:#1F5FBF;border-color:#1F5FBF;color:#fff}
.pill{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #C5CBD1;background:#fff;font-weight:600;font-size:13px}
.pill[aria-pressed=true]{background:#1B1F23;border-color:#1B1F23;color:#fff}
.bar{display:grid;grid-template-columns:140px minmax(0,1fr) 36px;gap:12px;align-items:center}
.bar .t{height:12px;background:#EEF0F2;border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:12px;background:#1F5FBF;border-radius:6px}
.scroll{overflow-x:auto}
.grid{display:grid;gap:14px;padding:14px 12px;border-bottom:1px solid #E6E9EC;font-size:13px;line-height:1.5}
.grid.head{background:#EEF0F2;border-radius:8px;border-bottom:0;padding:10px 12px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#3A424A}
.g5{grid-template-columns:64px minmax(0,2.6fr) minmax(0,1.2fr) minmax(0,1.6fr) minmax(0,1.6fr)}
.g4{grid-template-columns:64px minmax(0,2.4fr) minmax(0,1.2fr) minmax(0,2.2fr)}
.pre{white-space:pre-line;word-break:break-word}
.email{min-height:460px;padding:16px;border-radius:10px;border:1px solid #C5CBD1;background:#FBFBFC;font:14px/1.6 inherit;width:100%}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid #E6E9EC;border-radius:10px}
.check .chip{min-width:74px;text-align:center;font-size:11px;font-weight:700;padding:4px 8px}
.notice{padding:10px 14px;border-radius:10px;background:#E8EEFB;color:#1B3F8F}
.step{border:1px solid #DDE1E5;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 8px 6px 14px;border:1px solid #B3261E;border-radius:10px;background:#FFF4F2}
@media (max-width:640px){.wrap{padding:16px 12px 32px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
class Engine {
  /* ---------- small utils ---------- */
  xmlText(s) {
    return String(s).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
      .replace(/&#(\d+);/g, (m, n) => String.fromCharCode(+n)).replace(/&#x([0-9a-f]+);/gi, (m, n) => String.fromCharCode(parseInt(n, 16))).replace(/&amp;/g, '&');
  }
  colIdx(c) { let n = 0; for (let i = 0; i < c.length; i++) n = n * 26 + (c.charCodeAt(i) - 64); return n; }
  fmtNum(v) { if (/^-?\d+\.\d{6,}$/.test(v)) { return String(parseFloat(parseFloat(v).toFixed(4))); } return v; }
  fmtSize(n) { if (n < 1024) return n + ' B'; if (n < 1048576) return Math.round(n / 1024) + ' KB'; return (n / 1048576).toFixed(1) + ' MB'; }
  fmtDate(d) { return d.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getFullYear(); }
  cap(t) { t = String(t); return t.charAt(0).toUpperCase() + t.slice(1); }
  tok(s) {
    const stop = new Set('the and for with from will has have had not than then into over under per via this that these those its are was were been'.split(' '));
    return (String(s).toLowerCase().match(/[a-z0-9]+/g) || []).filter(w => w.length > 2 && !stop.has(w));
  }
  jac(a, b) { const A = new Set(a), B = new Set(b); if (!A.size || !B.size) return 0; let i = 0; A.forEach(x => { if (B.has(x)) i++; }); return i / (A.size + B.size - i); }
  contain(a, b) { const A = new Set(a), B = new Set(b); if (!A.size) return 0; let i = 0; A.forEach(x => { if (B.has(x)) i++; }); return i / A.size; }
  shorten(t, n) {
    t = String(t).replace(/\s+/g, ' ').trim();
    if (t.length <= n) return t;
    const first = t.match(/^[^.!?]{20,}?[.!?](?=\s|$)/);
    if (first && first[0].length <= n) return first[0];
    const cut = t.slice(0, n); const sp = cut.lastIndexOf(' ');
    return (sp > 40 ? cut.slice(0, sp) : cut) + ' …';
  }
  parseDate(t) {
    const M = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec']; let m;
    if ((m = t.match(/\b(20\d\d)-(\d{1,2})-(\d{1,2})\b/))) return new Date(+m[1], +m[2] - 1, +m[3]);
    if ((m = t.match(/\b(\d{1,2})(?:st|nd|rd|th)?[\s-]+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?,?(?:[\s-]+(20\d\d))?/i))) return new Date(m[3] ? +m[3] : new Date().getFullYear(), M.indexOf(m[2].toLowerCase()), +m[1]);
    if ((m = t.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(20\d\d))?\b/i))) return new Date(m[3] ? +m[3] : new Date().getFullYear(), M.indexOf(m[1].toLowerCase()), +m[2]);
    if ((m = t.match(/\b(\d{1,2})\/(\d{1,2})\/(20\d\d)\b/))) return new Date(+m[3], +m[2] - 1, +m[1]);
    return null;
  }

  /* ---------- zip / office readers ---------- */
  async inflate(bytes, fmt) {
    const ds = new DecompressionStream(fmt);
    const w = ds.writable.getWriter();
    w.write(bytes).catch(() => {}); w.close().catch(() => {});
    return new Uint8Array(await new Response(ds.readable).arrayBuffer());
  }
  async unzip(buf) {
    const dv = new DataView(buf), u8 = new Uint8Array(buf); let eocd = -1;
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
    if (eocd < 0) throw new Error('Not a valid Office file (zip directory not found).');
    const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
    const entries = {}; const dec = new TextDecoder('utf-8');
    for (let k = 0; k < n; k++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
      entries[dec.decode(u8.subarray(p + 46, p + 46 + nlen))] = { method, csize, lho };
      p += 46 + nlen + elen + clen;
    }
    const self = this;
    const read = async (name) => {
      const e = entries[name]; if (!e) return null;
      const start = e.lho + 30 + dv.getUint16(e.lho + 26, true) + dv.getUint16(e.lho + 28, true);
      const data = u8.subarray(start, start + e.csize);
      if (e.method === 0) return dec.decode(data);
      if (e.method === 8) return dec.decode(await self.inflate(data, 'deflate-raw'));
      return null;
    };
    return { names: Object.keys(entries), read };
  }
  wText(p) {
    return [...p.matchAll(/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>|<w:tab\/>|<w:br\/>/g)].map(m => m[1] !== undefined ? m[1] : ' ').join('');
  }
  async parseDocx(buf) {
    const z = await this.unzip(buf); const xml = await z.read('word/document.xml');
    if (!xml) throw new Error('word/document.xml not found.');
    const units = []; let heading = ''; let n = 0;
    const toks = xml.match(/<w:tr[ >][\s\S]*?<\/w:tr>|<w:p[ >][\s\S]*?<\/w:p>/g) || [];
    for (const t of toks) {
      n++;
      if (t.indexOf('<w:tr') === 0) {
        const cells = t.split('</w:tc>').map(c => this.xmlText(this.wText(c)).trim()).filter(Boolean);
        if (cells.length) units.push({ loc: (heading ? heading + ', ' : '') + 'table row', text: cells.join(' | '), ctx: heading, row: true });
        continue;
      }
      const text = this.xmlText(this.wText(t)).trim(); if (!text) continue;
      if (/<w:pStyle w:val="(?:Heading\d|Title)/.test(t)) { heading = text; continue; }
      units.push({ loc: heading ? heading + ' (para ' + n + ')' : 'Para ' + n, text, ctx: heading });
    }
    return units;
  }
  async parseXlsx(buf) {
    const z = await this.unzip(buf); const ss = [];
    const sst = await z.read('xl/sharedStrings.xml');
    if (sst) for (const m of sst.matchAll(/<si>([\s\S]*?)<\/si>/g)) ss.push(this.xmlText([...m[1].matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g)].map(x => x[1]).join('')));
    const wb = (await z.read('xl/workbook.xml')) || '';
    const names = [...wb.matchAll(/<sheet\s[^>]*?name="([^"]*)"/g)].map(m => this.xmlText(m[1]));
    const num = n => parseInt((n.match(/(\d+)\.xml$/) || [0, 0])[1], 10);
    const sheets = z.names.filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a, b) => num(a) - num(b));
    const units = []; let si = 0;
    for (const path of sheets) {
      const name = names[si++] || ('Sheet' + si); const xml = await z.read(path); if (!xml) continue;
      let hdr = null; let rc = 0;
      for (const rm of xml.matchAll(/<row\b[^>]*>([\s\S]*?)<\/row>/g)) {
        if (++rc > 3000) break;
        const cells = [];
        for (const cm of rm[1].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
          const attrs = cm[1], body = cm[2] || '';
          const ref = attrs.match(/\br="([A-Z]+)(\d+)"/) || []; const t = (attrs.match(/\bt="(\w+)"/) || [])[1];
          let v = '';
          if (t === 'inlineStr') v = this.xmlText([...body.matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g)].map(x => x[1]).join(''));
          else { const vm = body.match(/<v>([\s\S]*?)<\/v>/); if (vm) v = t === 's' ? (ss[+vm[1]] || '') : this.fmtNum(this.xmlText(vm[1])); }
          v = String(v).trim();
          if (v !== '') cells.push({ col: this.colIdx(ref[1] || 'A'), cn: ref[1] || '', row: ref[2] || '', v });
        }
        if (!cells.length) continue;
        if (!hdr && cells.length >= 2) { hdr = {}; cells.forEach(c => { hdr[c.col] = c.v; }); continue; }
        const numLike = /^[$\u00a3\u20ac]?\s?-?[\d,]+(?:\.\d+)?\s?(%|[kKmMbB]n?|million|billion)?$/;
        const text = (cells.length === 2 && !numLike.test(cells[0].v) && numLike.test(cells[1].v)) ? cells[0].v + ': ' + cells[1].v : cells.map(c => (hdr && hdr[c.col] && hdr[c.col] !== c.v) ? hdr[c.col] + ': ' + c.v : c.v).join('; ');
        const a = cells[0], b = cells[cells.length - 1];
        units.push({ loc: name + '!' + a.cn + a.row + ':' + b.cn + b.row, text, ctx: name, row: cells.length >= 2 });
      }
    }
    return units;
  }
  async parsePptx(buf) {
    const z = await this.unzip(buf); const units = [];
    const num = n => parseInt((n.match(/(\d+)\.xml$/) || [0, 0])[1], 10);
    const grab = async (path, label) => {
      const xml = await z.read(path); if (!xml) return;
      let title = '';
      for (const pm of xml.matchAll(/<a:p[ >][\s\S]*?<\/a:p>/g)) {
        const text = this.xmlText([...pm[0].matchAll(/<a:t(?:\s[^>]*)?>([\s\S]*?)<\/a:t>/g)].map(x => x[1]).join('')).trim();
        if (!text || /^\d+$/.test(text)) continue;
        if (!title) title = text;
        units.push({ loc: label, text, ctx: title });
      }
    };
    const slides = z.names.filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a, b) => num(a) - num(b));
    for (const p of slides) await grab(p, 'Slide ' + num(p));
    const notes = z.names.filter(n => /^ppt\/notesSlides\/notesSlide\d+\.xml$/.test(n)).sort((a, b) => num(a) - num(b));
    for (const p of notes) await grab(p, 'Slide ' + num(p) + ' notes');
    return units;
  }

  /* ---------- text-like readers ---------- */
  parseText(text) {
    const units = []; let heading = ''; const lines = text.split(/\r?\n/);
    lines.forEach((raw, i) => {
      let t = raw.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, '').trim(); if (!t) return;
      const h = raw.match(/^\s*#{1,6}\s+(.*)$/);
      if (h) { heading = h[1].trim(); return; }
      if (t.length <= 60 && (/:$/.test(t) || (t === t.toUpperCase() && /[A-Z]/.test(t)))) { heading = t.replace(/:$/, ''); return; }
      units.push({ loc: (heading ? heading + ', ' : '') + 'line ' + (i + 1), text: t, ctx: heading });
    });
    return units;
  }
  csvRows(text, d) {
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === d) { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; }
      else cur += ch;
    }
    row.push(cur); if (row.some(x => x.trim() !== '')) rows.push(row);
    return rows;
  }
  parseCsv(text, d) {
    const rows = this.csvRows(text, d); if (!rows.length) return [];
    const hdr = rows[0].map(x => x.trim()); const units = [];
    rows.slice(1, 3001).forEach((r, i) => {
      const t = r.map((v, j) => { v = v.trim(); if (!v) return ''; return hdr[j] && hdr[j] !== v ? hdr[j] + ': ' + v : v; }).filter(Boolean).join('; ');
      if (t) units.push({ loc: 'Row ' + (i + 2), text: t, ctx: '', row: true });
    });
    return units;
  }
  parseJson(text) {
    const out = [];
    const walk = (v, path) => {
      if (out.length > 2000) return;
      if (v && typeof v === 'object') { Object.keys(v).forEach(k => walk(v[k], path ? path + '.' + k : k)); }
      else if (v !== null && v !== '') out.push({ loc: path || 'root', text: (path ? path.split('.').pop() + ': ' : '') + String(v), ctx: path.split('.')[0] || '' });
    };
    walk(JSON.parse(text), ''); return out;
  }
  parseHtml(text) {
    const t = text.replace(/<(script|style)[\s\S]*?<\/\1>/gi, ' ').replace(/<\/(p|div|li|tr|h\d|table|section)>/gi, '\n').replace(/<br\s*\/?>/gi, '\n').replace(/<h(\d)[^>]*>/gi, '\n# ').replace(/<[^>]+>/g, ' ');
    return this.parseText(this.xmlText(t.replace(/&nbsp;/g, ' ')));
  }
  a85(bytes) {
    const out = []; let grp = [], i = 0;
    const s = new TextDecoder('latin1').decode(bytes);
    for (; i < s.length; i++) {
      const c = s[i];
      if (c === '~') break;
      if (/\s/.test(c)) continue;
      if (c === 'z' && !grp.length) { out.push(0, 0, 0, 0); continue; }
      const v = c.charCodeAt(0) - 33; if (v < 0 || v > 84) continue;
      grp.push(v);
      if (grp.length === 5) { let n = 0; for (const g of grp) n = n * 85 + g; out.push((n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255); grp = []; }
    }
    if (grp.length > 1) { const k = grp.length; while (grp.length < 5) grp.push(84); let n = 0; for (const g of grp) n = n * 85 + g; const b = [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255]; for (let j = 0; j < k - 1; j++) out.push(b[j]); }
    return new Uint8Array(out);
  }
  async parsePdf(buf) {
    const u8 = new Uint8Array(buf); const s = new TextDecoder('latin1').decode(u8);
    const units = []; let i = 0, page = 0, streams = 0, printable = 0, total = 0;
    const unesc = (str) => str.replace(/\\([nrtbf()\\]|[0-7]{1,3})/g, (m, c) => { if (c === 'n') return '\n'; if (c === 'r') return ''; if (c === 't') return ' '; if (c === 'b' || c === 'f') return ''; if (c.length === 1 && '()\\'.indexOf(c) >= 0) return c; return String.fromCharCode(parseInt(c, 8)); });
    while (streams < 600) {
      const k = s.indexOf('stream', i); if (k < 0) break;
      i = k + 6;
      if (s.slice(Math.max(0, k - 3), k) === 'end') continue;
      let st = i; if (s[st] === '\r') st++; if (s[st] === '\n') st++;
      const en = s.indexOf('endstream', st); if (en < 0) break;
      i = en + 9; streams++;
      const dict = s.slice(Math.max(0, s.lastIndexOf('obj', k)), k);
      let content;
      try {
        let raw = u8.subarray(st, en);
        if (/ASCII85Decode/.test(dict)) raw = this.a85(raw);
        content = /FlateDecode/.test(dict) ? new TextDecoder('latin1').decode(await this.inflate(raw, 'deflate')) : new TextDecoder('latin1').decode(raw);
      } catch (e) { continue; }
      if (content.indexOf('BT') < 0) continue;
      page++;
      let line = '';
      const rx = /\[((?:\\.|[^\]\\])*)\]\s*TJ|\(((?:\\.|[^\\)])*)\)\s*(?:Tj|'|")|(T\*|Td|TD|Tm|ET)/g; let m;
      const flush = () => { const t = line.replace(/\s+/g, ' ').trim(); if (t.length > 1) units.push({ loc: 'Page ~' + page, text: t, ctx: '' }); line = ''; };
      while ((m = rx.exec(content))) {
        if (m[1] !== undefined) {
          const parts = [...m[1].matchAll(/\(((?:\\.|[^\\)])*)\)|(-?\d+(?:\.\d+)?)/g)];
          parts.forEach(p => { if (p[1] !== undefined) line += unesc(p[1]); else if (parseFloat(p[2]) < -200) line += ' '; });
        } else if (m[2] !== undefined) line += unesc(m[2]);
        else flush();
      }
      flush();
    }
    units.forEach(u => { total += u.text.length; for (let j = 0; j < u.text.length; j++) { const c = u.text.charCodeAt(j); if ((c >= 32 && c < 127)) printable++; } });
    // merge short fragments into sentence-like lines
    const merged = []; let buf2 = null;
    units.forEach(u => {
      if (buf2 && buf2.loc === u.loc && /[a-z,]$/.test(buf2.text) && /^[a-z]/.test(u.text) && buf2.text.length < 160) buf2.text += ' ' + u.text;
      else { if (buf2) merged.push(buf2); buf2 = { loc: u.loc, text: u.text, ctx: '' }; }
    });
    if (buf2) merged.push(buf2);
    merged.quality = total ? printable / total : 0;
    return merged;

  /* ---------- file ingestion ---------- */

      setState({ notice: 'Copy was blocked here. Select the text and press Ctrl or Cmd + C.' });
    };
    try { navigator.clipboard.writeText(text).then(onOk).catch(fail); } catch (x) { fail(); }
  }

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var act = t.getAttribute('data-act'), v = t.getAttribute('data-v'), id = t.getAttribute('data-id');
    if (act === 'tab') setState({ tab: v, copied: false });
    else if (act === 'filter') setState({ filter: v });
    else if (act === 'remove') { var f = S.files.filter(function (x) { return x.id === id; })[0]; setState({ files: S.files.filter(function (x) { return x.id !== id; }), notice: (f ? f.name : 'File') + ' removed.' }); }
    else if (act === 'askReset') setState({ confirmReset: true });
    else if (act === 'cancelReset') setState({ confirmReset: false });
    else if (act === 'doReset') { memo = null; S = defaults(); S.notice = 'Dashboard reset. All files, settings and results were cleared.'; render(); }
    else if (act === 'copyEmail') copyText(lastModel.em.text, function () { setState({ copied: true }); }, document.getElementById('emailbox'));
    else if (act === 'copyMd') copyText(markdown(lastModel), function () { setState({ copiedMd: true }); }, null);
    else if (act === 'download') {
      var md = markdown(lastModel);
      (async function () {
        try { await dl.save({ filename: 'briefing-draft.md', data: new Blob([md], { type: 'text/markdown' }) }); setState({ notice: 'Briefing saved.' }); }
        catch (x1) { try { await dl.save({ filename: 'briefing-draft.md', data: md }); setState({ notice: 'Briefing saved.' }); } catch (x2) { setState({ notice: 'Download was declined or is unavailable. Use Copy full briefing instead.' }); } }
      })();
    }
  });
  app.addEventListener('change', function (e) {
    var t = e.target, k = t.getAttribute('data-change'); if (!k) return;
    if (k === 'files') { var l = Array.prototype.slice.call(t.files || []); t.value = ''; addFiles(l); }
    else if (k === 'role') { var id = t.getAttribute('data-id'), val = t.value; setState({ files: S.files.map(function (x) { return x.id === id ? Object.assign({}, x, { role: val }) : x; }) }); }
    else if (k === 'audience') setState({ audience: t.value });
  });
  app.addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-input'); if (!k) return;
    S[k] = e.target.value; clearTimeout(rt); rt = setTimeout(renderRight, 250);
  });
  app.addEventListener('dragover', function (e) { var d = e.target.closest('#drop'); if (!d) return; e.preventDefault(); d.classList.add('over'); });
  app.addEventListener('dragleave', function (e) { var d = e.target.closest('#drop'); if (d) d.classList.remove('over'); });
  app.addEventListener('drop', function (e) { var d = e.target.closest('#drop'); if (!d) return; e.preventDefault(); d.classList.remove('over'); addFiles(e.dataTransfer && e.dataTransfer.files); });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { if (!e.target.closest || !e.target.closest('#drop')) e.preventDefault(); });

  render();
  try { if (window.claude && window.claude.use) { window.claude.use('downloads').then(function (d) { if (d) { dl = d; render(); } }).catch(function () {}); } } catch (x) {}
})();
</script>
</body>
</html>
